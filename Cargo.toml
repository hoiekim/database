[workspace]
resolver = "2"
members = ["protocol", "engine", "client", "server", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

# Every dependency runs inside the process that holds everyone's data, so
# the list is kept to what the standard library lacks: an async runtime for
# the network side, a CRC for page and log checksums, JSON for the
# columns that hold it, and TLS for clients on other hosts. TLS is rustls
# with nothing it can do without: TLS 1.3 alone, no logging, and `ring`
# for the ciphers, the smaller of the two libraries rustls is built on.
[workspace.dependencies]
tokio = { version = "1", default-features = false }
crc32fast = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# The storage tests run thousands of simulated crashes; unoptimized, the
# page and checksum code makes them take minutes.
[profile.dev.package.database-engine]
opt-level = 2
[profile.dev.package.crc32fast]
opt-level = 3
